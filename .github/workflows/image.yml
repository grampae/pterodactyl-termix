name: Build container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      termix_version:
        description: Termix release to wrap (for example 26.11.2)
        required: false

permissions:
  contents: read
  packages: write

env:
  # Default Termix release; override with the workflow_dispatch input.
  TERMIX_VERSION: ${{ github.event.inputs.termix_version || '26.11.2' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pterodactyl-termix
          tags: |
            type=raw,value=${{ env.TERMIX_VERSION }}
            type=raw,value=latest
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TERMIX_VERSION=${{ env.TERMIX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
